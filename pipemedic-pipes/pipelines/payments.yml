# payments service: lint, test, benchmark, package, deploy to a runner, smoke test.
# Run it by hand and pick a scenario to see how PipeMedic explains each kind of failure.
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [main]
  paths:
    include:
      - services/payments
      - pipelines

pr:
  branches:
    include: [main]
  paths:
    include:
      - services/payments
      - pipelines

parameters:
  - name: scenario
    displayName: Failure scenario (demo)
    type: string
    default: none
    values:
      - none
      - test-failure
      - lint-error
      - dependency-missing
      - missing-config
      - network-timeout
      - flaky-test
      - permission-denied
      - memory-hog
      - cpu-starvation
      - disk-full
  - name: deploy
    displayName: Deploy after the build (main and demo/* branches only)
    type: boolean
    default: true

stages:
  - template: templates/service-ci.yml
    parameters:
      service: payments
      port: 8002
      scenario: ${{ parameters.scenario }}
      deploy: ${{ parameters.deploy }}
